[project]
name = "double-descent-101"
version = "0.1.0"
description = "Double Descent 101: everything your stats class taught you about overfitting is wrong"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "double-descent",
    "bias-variance",
    "overfitting",
    "interpolation",
    "benign-overfitting",
    "machine-learning",
    "education",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "streamlit>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4", # optional: confirm double descent on a tiny MLP (CPU wheels, see tool.uv below)
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1a7",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

# --- Build: install `src` as a package so `import src` works from notebooks/, app/ and pytest ---
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- uv: pull torch from the CPU-only index (PyPI Linux wheels drag in GBs of CUDA libs) ---
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# --- Ruff ---
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "torch: needs the optional torch extra (skipped when torch is not installed)",
]

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
skip_empty = true
